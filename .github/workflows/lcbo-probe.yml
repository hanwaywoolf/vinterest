# Reads LCBO.dev's GraphQL schema and a sample search from GitHub's machines (this repo's dev
# environment can't reach lcbo.dev) and posts them as a comment on the commit, so the LCBO lookup
# is built against the real API. Runs on a claude/ branch commit whose message has [lcbo-probe].
name: LCBO probe
on:
  push:
    branches: ['claude/**']
jobs:
  probe:
    if: contains(github.event.head_commit.message, '[lcbo-probe]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # to post the results as a comment on the commit
    steps:
      - name: Probe
        run: |
          q() { curl -sS -m 30 -X POST https://api.lcbo.dev/graphql -H 'content-type: application/json' -d "$1" -w '\nHTTP %{http_code}\n' 2>&1 | head -c 40000; }
          {
            echo '## Query fields'; echo '```'
            q '{"query":"{ __schema { queryType { fields { name description args { name type { name kind ofType { name kind } } } type { name kind ofType { name kind } } } } } }"}'
            echo '```'
            echo '## Types (fields)'; echo '```'
            q '{"query":"{ __schema { types { name kind fields { name type { name kind ofType { name kind ofType { name } } } } } } }"}' | node -e '
              let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s.split("\nHTTP")[0]);for(const t of j.data.__schema.types){if(t.name.startsWith("__")||!t.fields)continue;console.log(t.name+": "+t.fields.map(f=>f.name+":"+(f.type.name||(f.type.ofType&&(f.type.ofType.name||(f.type.ofType.ofType&&f.type.ofType.ofType.name)))||f.type.kind)).join(", "))}}catch(e){console.log(s.slice(0,3000))}})'
            echo '```'
            echo '## Landing page'; echo '```'
            curl -sS -m 20 https://lcbo.dev/ | sed -e 's/<[^>]*>/ /g' | tr -s ' \n' | head -c 6000
            echo; echo '```'
          } > probe.md
          wc -c probe.md
      - name: Post
        if: always()
        run: |
          node -e "const t=require('fs').readFileSync('probe.md','utf8');require('fs').writeFileSync('c.json',JSON.stringify({body:t.slice(0,60000)}))"
          curl -sS -X POST -H "authorization: Bearer $GH_TOKEN" -H "accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -d @c.json > /dev/null
        env:
          GH_TOKEN: ${{ github.token }}
