# Reads LCBO.dev's GraphQL schema and a sample search from GitHub's machines (this repo's dev
# environment can't reach lcbo.dev) and posts them as a comment on the commit, so the LCBO lookup
# is built against the real API. Runs on a claude/ branch commit whose message has [lcbo-probe].
name: LCBO probe
on:
  push:
    branches: ['claude/**']
jobs:
  probe:
    if: contains(github.event.head_commit.message, '[lcbo-probe]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # to post the results as a comment on the commit
    steps:
      - name: Probe
        run: |
          q() { curl -sS -m 30 -X POST https://api.lcbo.dev/graphql -H 'content-type: application/json' -d "$1" -w '\nHTTP %{http_code}\n' 2>&1 | head -c 40000; }
          {
            for body in \
              '{"query":"{ products(filters:{search:\"Ardanza\"}, pagination:{first:3}) { totalCount edges { node { sku name producerName priceInCents } } } }"}' \
              '{"query":"{ products(filters:{search:\"Muga\"}, pagination:{first:5}) { totalCount edges { node { sku name producerName priceInCents unitVolumeMl primaryCategory } } } }"}' \
              '{"query":"{ products(filters:{name:\"Muga\"}, pagination:{first:5}) { totalCount edges { node { sku name producerName priceInCents } } } }"}' \
              '{"query":"{ products(filters:{producer:\"Bodegas Muga\"}, pagination:{first:5}) { totalCount edges { node { sku name producerName priceInCents } } } }"}' \
              '{"query":"{ products(filters:{search:\"rioja reserva\"}, pagination:{first:5}) { totalCount edges { node { sku name producerName priceInCents regionName } } } }"}' \
              '{"query":"{ products(filters:{search:\"Tignanello\"}, pagination:{first:3}) { totalCount edges { node { sku name producerName priceInCents } } } }"}' \
              '{"query":"{ products(pagination:{first:2}, sortBy:SELL_RANK_MONTHLY) { totalCount edges { node { sku name producerName priceInCents primaryCategory } } } }"}' \
              '{"query":"{ stores(pagination:{first:2}) { totalCount edges { node { externalId name city } } } }"}' \
              '{"query":"{ stores(filters:{latitude:45.4215, longitude:-75.6972, radiusKm:10}, pagination:{first:3}) { edges { node { externalId name city distanceKm } } } }"}' ; do
              echo "## $body" | head -c 200; echo; echo '```'; q "$body"; echo '```'; sleep 2
            done
            echo '## product-discovery'; echo '```'
            curl -sSL -m 20 "https://lcbo.dev/how-to/product-discovery" -o page.html
            node -e 'const h=require("fs").readFileSync("page.html","utf8");const m=h.match(/<main[\s\S]*?<\/main>/);const t=(m?m[0]:h).replace(/<script[\s\S]*?<\/script>/g,"").replace(/<style[\s\S]*?<\/style>/g,"").replace(/<[^>]+>/g," ").replace(/\s+/g," ");console.log(t.slice(0,5000))'
            echo '```'
          } > probe.md



          wc -c probe.md
      - name: Post
        if: always()
        run: |
          node -e "const t=require('fs').readFileSync('probe.md','utf8');require('fs').writeFileSync('c.json',JSON.stringify({body:t.slice(0,60000)}))"
          curl -sS -X POST -H "authorization: Bearer $GH_TOKEN" -H "accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -d @c.json > /dev/null
        env:
          GH_TOKEN: ${{ github.token }}
