# Runs scripts/model-trial.mjs on GitHub's machines, so a model can be compared from any device
# (a Chromebook, a phone): Actions → Model trial → Run workflow (once this file is on main), or a
# commit on a claude/ branch whose message contains [model-trial] (the defaults below). The report is on the run's page
# (its summary), posted as a comment on the commit, and kept as the "model-trial" artifact. Every call is a real, billed Claude call
# (about 16 for the defaults).
name: Model trial
on:
  workflow_dispatch:
    inputs:
      b:
        description: Deployment to try (a preview with CLAUDE_MODEL set)
        default: https://claude-sleepy-shannon-61xvx1.vinterest.pages.dev
      a:
        description: Deployment to compare against
        default: https://vinterest.pages.dev
      runs:
        description: Runs per request
        default: '2'
      image_url:
        description: Optional link to a photo of a wine label, to include a label scan
        default: ''
  push:
    branches: ['claude/**']
jobs:
  trial:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[model-trial]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # to post the report as a comment on the commit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch the label photo
        if: inputs.image_url != ''
        run: curl -sSfL "$IMAGE_URL" -o label.jpg
        env:
          IMAGE_URL: ${{ inputs.image_url }}
      - name: Run the trial
        run: |
          IMG=""; [ -f label.jpg ] && IMG="--image label.jpg"
          node scripts/model-trial.mjs --a "$A" --b "$B" --runs "$RUNS" $IMG
          cat model-trial.md >> "$GITHUB_STEP_SUMMARY"
        env:
          A: ${{ inputs.a || 'https://vinterest.pages.dev' }}
          B: ${{ inputs.b || 'https://claude-sleepy-shannon-61xvx1.vinterest.pages.dev' }}
          RUNS: ${{ inputs.runs || '2' }}
      - name: Post the report on the commit
        if: always() && hashFiles('model-trial.md') != ''
        run: |
          node -e "const t=require('fs').readFileSync('model-trial.md','utf8');require('fs').writeFileSync('c.json',JSON.stringify({body:t.length>60000?t.slice(0,60000)+'\n\n(cut short: the full report is the model-trial artifact)':t}))"
          curl -sS -X POST -H "authorization: Bearer $GH_TOKEN" -H "accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -d @c.json > /dev/null
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-trial
          path: model-trial.md
          if-no-files-found: ignore
