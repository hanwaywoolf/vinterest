# Builds the iPhone app on a GitHub Mac, signs it and uploads it to TestFlight, on every push to
# main and on demand (Actions → TestFlight → Run workflow). Setup, once: docs/testflight.md.
#   - Signing is Xcode's automatic signing through an App Store Connect API key, at export: Apple
#     creates and keeps the distribution certificate and profile, so there are no certificate files
#     to manage and no iPhone needs registering (the archive itself is built unsigned).
#   - Until the key (secrets ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8) and the team (variable
#     APPLE_TEAM_ID) are set, the check job says so and nothing else runs.
#   - Version: package.json's "version". Build number: this workflow's run number ×10 + attempt,
#     so every upload, re-runs included, has a new, higher number.
name: TestFlight
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: testflight
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          missing=""
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID; do [ -n "${!v}" ] || missing="$missing $v"; done
          if [ -n "$missing" ]; then
            echo "::notice title=TestFlight upload skipped::Not set up yet, missing:$missing. See docs/testflight.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
  testflight:
    needs: check
    if: needs.check.outputs.ready == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      # Push notifications (docs/push.md): on once the variable PUSH_ENABLED is 1 (the APNs key is made and the
      # App ID has Push Notifications). Off, this workflow does exactly what it did before.
      VINTEREST_PUSH: ${{ vars.PUSH_ENABLED == '1' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # App Store uploads must be built with a recent Xcode: use the newest one on the runner.
      - name: Use the newest Xcode
        run: |
          X=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$X"
          xcodebuild -version
      - run: npm ci
      - run: npm run build
      - run: node scripts/native.mjs ios
      - name: API key
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"
      # Archived unsigned: automatic signing would first sign for development, which needs a
      # registered iPhone ("Your team has no devices"). The upload step signs it for App Store
      # distribution, creating the certificate and profile itself, and that needs no device.
      - name: Archive (unsigned)
        run: |
          set -o pipefail
          # With push on the app must carry its aps-environment entitlement, which only a signature
          # holds: signed ad hoc ("-", no profile), then re-signed for distribution at upload.
          if [ "$VINTEREST_PUSH" = "1" ]; then SIGN="CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=YES PROVISIONING_PROFILE_SPECIFIER="
          else SIGN="CODE_SIGN_STYLE=Automatic CODE_SIGNING_ALLOWED=NO"; fi
          VERSION=$(node -p "require('./package.json').version")
          BUILD=$(( ${{ github.run_number }} * 10 + ${{ github.run_attempt }} ))
          echo "Vinterest $VERSION ($BUILD)"
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Vinterest.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" $SIGN \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" \
            archive 2>&1 | tee "$RUNNER_TEMP/archive.log" || {
            # Xcode's own error lines as annotations, so a failure says why on the run's summary
            # (exit code 65 alone doesn't).
            grep -E '(error|Error):' "$RUNNER_TEMP/archive.log" | sort -u | head -20 | while IFS= read -r l; do echo "::error title=Archive::$l"; done
            exit 1; }
      - name: Check the app carries its push entitlement
        if: env.VINTEREST_PUSH == '1'
        run: |
          APP=$(ls -d "$RUNNER_TEMP"/Vinterest.xcarchive/Products/Applications/*.app | head -1)
          codesign -d --entitlements :- "$APP" 2>/dev/null | tee "$RUNNER_TEMP/ent.txt"
          grep -q aps-environment "$RUNNER_TEMP/ent.txt" || { echo "::error title=Push::The archive has no aps-environment entitlement, so notifications would never arrive. Unset PUSH_ENABLED to go back to the plain build."; exit 1; }
      - name: Upload to TestFlight
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Vinterest.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee "$RUNNER_TEMP/export.log" || {
            grep -E '(error|Error):' "$RUNNER_TEMP/export.log" | sort -u | head -20 | while IFS= read -r l; do echo "::error title=Upload::$l"; done
            exit 1; }
      # Internal testers get every processed build by themselves: automatic distribution on each
      # internal group (made if there is none), through the same API key (scripts/testflight-groups.mjs).
      - name: Give the build to internal testers
        run: node scripts/testflight-groups.mjs
      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
