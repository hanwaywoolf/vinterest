<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Vinterest trailer</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#0d0d0f;font-family:Poppins,sans-serif;color:#fff}
.stage{position:relative;width:1920px;height:1080px;overflow:hidden;
  background:radial-gradient(ellipse 60% 80% at 24% 30%,var(--glow,#8B1A2F)88,transparent 70%),radial-gradient(ellipse 45% 60% at 86% 90%,var(--glow,#8B1A2F)44,transparent 70%),#0d0d0f;
  transition:--glow 1s}
/* The phone: the real app in an iframe at a phone's own width (412px), enlarged with zoom (not a transform, which
   rasterises the text at one size and stretches it) to fill the height. */
.phone{position:absolute;right:160px;top:50%;transform:translateY(-50%);zoom:1.06;width:434px;height:914px;border-radius:52px;padding:11px;background:#141416;
  box-shadow:0 40px 120px #000c,0 0 90px rgba(224,90,116,.22);border:1px solid #ffffff22;opacity:0;transition:opacity .6s ease}
.phone.on{opacity:1}
.logo{opacity:0;transition:opacity .6s ease}.logo.on{opacity:.9}
.phone iframe{display:block;width:412px;height:892px;border:0;border-radius:42px;background:#0f0f0f}
/* The words, left of the phone. */
.copy{position:absolute;left:150px;top:0;bottom:0;width:980px;display:grid;align-items:center}
.logo{position:absolute;left:150px;top:96px;height:56px;width:auto;filter:invert(1) brightness(2);opacity:.9}
h1{font-size:92px;line-height:1.04;font-weight:800;letter-spacing:-2.5px;margin:0 0 26px;max-width:900px}
h1 b{color:#E05A74;font-weight:800}
p.sub{font-size:34px;line-height:1.4;color:rgba(255,255,255,.72);margin:0;max-width:820px;font-weight:400}
.cap{grid-area:1/1;opacity:0;transform:translateY(22px);transition:opacity .55s ease,transform .55s cubic-bezier(.2,.8,.2,1)}
.cap.on{opacity:1;transform:none}
.cap.off{opacity:0;transform:translateY(-18px);transition:opacity .4s ease,transform .4s ease}
/* The end card. */
.end{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;opacity:0;transition:opacity .7s ease;background:radial-gradient(ellipse 50% 60% at 50% 40%,#8B1A2F77,transparent 70%),#0d0d0f;z-index:5}
.end.on{opacity:1}
/* The opening: the logo and the line, while the app loads behind the hidden phone. */
.intro{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;opacity:1;transition:opacity .6s ease;background:radial-gradient(ellipse 50% 60% at 50% 45%,#8B1A2F66,transparent 70%),#0d0d0f;z-index:4}
.intro.off{opacity:0}
.intro img{height:120px;width:auto;filter:invert(1) brightness(2);animation:introIn 1.1s cubic-bezier(.2,.8,.2,1) both}
.intro p{font-size:40px;color:rgba(255,255,255,.78);margin:30px 0 0;animation:introIn 1.1s .35s cubic-bezier(.2,.8,.2,1) both}
@keyframes introIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.end img{height:110px;width:auto;filter:invert(1) brightness(2)}
.end h2{font-size:84px;font-weight:800;letter-spacing:-2px;margin:36px 0 14px}
.end p{font-size:36px;color:rgba(255,255,255,.72);margin:0}
.end .url{margin-top:40px;font-size:30px;color:#E05A74;font-weight:600;letter-spacing:.04em}
.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 80% 80% at 50% 50%,transparent 60%,#00000066 100%)}
</style></head>
<body><div class="stage" id="stage">
  <img class="logo" src="logo.png" alt="">
  <div class="copy" id="copy"></div>
  <div class="phone" id="phone"><iframe name="app" id="app" src="about:blank"></iframe></div>
  <div class="vignette"></div>
  <div class="intro" id="intro"><img src="logo.png" alt=""><p>Know a wine before you pour it.</p></div>
  <div class="end" id="end"><img src="logo.png" alt=""><h2>Find wines you'll <b style="color:#E05A74">love</b>.</h2><p>Scan a label. Know before you pour.</p><div class="url">vinterest.app</div></div>
</div>
<script>
  /* Driven by scripts/trailer.mjs: a caption slides in (the old one slides out), the glow takes a colour, the end card fades in. */
  var cur = null;
  window.__caption = function (title, sub) {
    var copy = document.getElementById('copy');
    if (cur) { var old = cur; old.className = 'cap off'; setTimeout(function () { old.remove(); }, 450); }
    var el = document.createElement('div'); el.className = 'cap';
    el.innerHTML = '<h1>' + title + '</h1>' + (sub ? '<p class="sub">' + sub + '</p>' : '');
    copy.appendChild(el); cur = el;
    void el.offsetWidth; el.className = 'cap on';
  };
  window.__glow = function (c) { document.getElementById('stage').style.setProperty('--glow', c); };
  window.__end = function () { if (cur) cur.className = 'cap off'; document.getElementById('end').className = 'end on'; };
  window.__load = function (url) { document.getElementById('app').src = url; };
  window.__begin = function () { document.getElementById('intro').className = 'intro off'; document.getElementById('phone').className = 'phone on'; document.querySelector('.logo').className = 'logo on'; };
</script></body></html>
