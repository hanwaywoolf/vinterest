<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=540"/>
<title>Vinterest: scan a label, see if it's for you</title>
<link rel="stylesheet" href="/fonts/fonts.css"/>
<link rel="stylesheet" href="/site.css"/>
<style>
  /* One 540 x 960 scene (recorded at 1080 x 1920). Everything is driven from the clock T in render().
     A phone, a bottle label held up to its camera, then the app's own screens. */
  html, body { margin: 0; background: #0b0606; overflow: hidden; width: 1080px; height: 1920px; font-family: 'Poppins', sans-serif; }
  #scene { position: absolute; left: 0; top: 0; width: 540px; height: 960px; overflow: hidden; transform: scale(2); transform-origin: 0 0;
    background: radial-gradient(70% 45% at 85% 12%, rgba(139,26,47,.55), transparent 70%), radial-gradient(60% 40% at 5% 95%, rgba(139,26,47,.35), transparent 70%), #0b0606; }
  *, *::before, *::after { transition: none !important; animation: none !important; }
  #cap { position: absolute; left: 28px; right: 28px; top: 44px; z-index: 7; text-align: center; color: #fff; font-weight: 600; font-size: 26px; letter-spacing: -.03em; line-height: 1.15; opacity: 0; }
  #cap b { color: #ff5a73; font-weight: 700; }
  #phone { position: absolute; left: 0; top: 0; z-index: 5; transform-origin: 0 0; --s: .9; }
  #phone .phone-slot { --s: 1; }
  /* The camera screen, drawn over the app's own area while the label is scanned. */
  #cam { position: absolute; inset: 0; z-index: 4; background: #0A0A0A; color: #fff; font-family: 'Poppins', sans-serif; overflow: hidden; }
  #feed { position: absolute; inset: 0; overflow: hidden; }
  #feed svg { position: absolute; left: 50%; top: 50%; width: 560px; height: 840px; margin: -420px 0 0 -280px; transform-origin: 50% 50%; }
  #cam .top { position: absolute; z-index: 3; left: 0; right: 0; top: 0; padding: 52px 20px 16px; display: flex; justify-content: space-between; align-items: center; }
  #cam .top .btn { width: 38px; height: 38px; border-radius: 19px; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; }
  #cam .top span.t { font-size: 18px; font-weight: 600; }
  #frame { position: absolute; z-index: 2; left: 3%; right: 3%; top: 108px; bottom: 214px; box-shadow: 0 0 0 2000px rgba(0,0,0,.52); }
  #frame i { position: absolute; width: 48px; height: 48px; border: 0 solid #8B1A2F; }
  #frame i:nth-child(1) { left: -2px; top: -2px; border-top-width: 3px; border-left-width: 3px; border-top-left-radius: 10px; }
  #frame i:nth-child(2) { right: -2px; top: -2px; border-top-width: 3px; border-right-width: 3px; border-top-right-radius: 10px; }
  #frame i:nth-child(3) { left: -2px; bottom: -2px; border-bottom-width: 3px; border-left-width: 3px; border-bottom-left-radius: 10px; }
  #frame i:nth-child(4) { right: -2px; bottom: -2px; border-bottom-width: 3px; border-right-width: 3px; border-bottom-right-radius: 10px; }
  #frame .pill { position: absolute; left: 0; right: 0; bottom: 16px; text-align: center; }
  #frame .pill span { font-size: 16px; color: rgba(255,255,255,.75); background: rgba(0,0,0,.5); padding: 5px 14px; border-radius: 20px; }
  #scanline { position: absolute; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, transparent, #ff5a73, transparent); box-shadow: 0 0 18px 4px rgba(255,90,115,.6); opacity: 0; }
  #cam .bottom { position: absolute; z-index: 3; left: 0; right: 0; bottom: 0; padding: 0 20px 44px; display: flex; flex-direction: column; align-items: center; gap: 20px; }
  #cam .toggle { display: inline-flex; background: rgba(0,0,0,.55); border-radius: 10px; overflow: hidden; }
  #cam .toggle div { padding: 10px 24px; font-size: 17px; font-weight: 600; color: rgba(255,255,255,.6); }
  #cam .toggle div.on { background: #8B1A2F; color: #fff; }
  #cam .row { display: flex; align-items: center; justify-content: center; gap: 28px; width: 100%; }
  #cam .side { width: 48px; height: 48px; border-radius: 12px; background: rgba(0,0,0,.55); border: 1.5px solid rgba(255,255,255,.25); }
  #shutter { width: 74px; height: 74px; border-radius: 37px; background: rgba(255,255,255,.92); border: 4px solid rgba(255,255,255,.35); display: flex; align-items: center; justify-content: center; }
  #shutter b { width: 56px; height: 56px; border-radius: 28px; background: #8B1A2F; }
  #flash { position: absolute; inset: 0; z-index: 6; background: #fff; opacity: 0; }
  /* "Analysing label…": the app's own wording and layout while Claude reads the photo. */
  #read { position: absolute; inset: 0; z-index: 5; background: #0A0A0A; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; opacity: 0; }
  #read .thumb { width: 70%; aspect-ratio: 2 / 3; border-radius: 16px; overflow: hidden; border: 2px solid #8B1A2F; box-shadow: 0 0 40px rgba(139,26,47,.35); position: relative; }
  #read .thumb svg { position: absolute; left: 50%; top: 50%; width: 560px; height: 840px; margin: -420px 0 0 -280px; transform: translateY(-150px) scale(.62); transform-origin: 50% 50%; }
  #read .sp { width: 44px; height: 44px; border-radius: 22px; border: 3px solid rgba(255,255,255,.1); border-top-color: #8B1A2F; }
  #read b { display: block; color: #fff; font-size: 19px; font-weight: 700; text-align: center; }
  #read span { display: block; font-size: 16px; color: rgba(255,255,255,.4); text-align: center; margin-top: 4px; }
  #fade { position: absolute; inset: 0; z-index: 6; background: #fff; opacity: 0; pointer-events: none; }
  #end { position: absolute; inset: 0; z-index: 9; background: #0b0606; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; opacity: 0; text-align: center; padding: 0 36px;
    background-image: radial-gradient(70% 45% at 85% 12%, rgba(139,26,47,.55), transparent 70%), radial-gradient(60% 40% at 5% 95%, rgba(139,26,47,.35), transparent 70%); }
  #end h1 { margin: 0; font-weight: 500; font-size: 44px; letter-spacing: -.05em; line-height: 1.1; color: #fff; }
  #end h1 strong { color: #ff5a73; font-weight: 700; }
  #end img { height: 44px; filter: brightness(0) invert(1); }
  #end .btn { margin-top: 6px; display: inline-block; padding: 14px 30px; border-radius: 14px; background: #8B1A2F; color: #fff; font-weight: 600; font-size: 20px; }
  #end p { margin: 0; color: rgba(255,255,255,.55); font-size: 16px; }
</style>
</head>
<body>
<div id="scene">
  <div id="cap"></div>
  <div id="phone"><div class="phone-slot"><div class="phone"><div class="phone-screen">
    <div class="statusbar"><span>9:41</span><span class="sig"><i style="width:18px"></i><i style="width:24px"></i></span></div>
    <div class="phone-app" id="app"></div>
    <div id="cam">
      <div id="feed"><!--LABEL--></div>
      <div class="top"><div class="btn"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 3 5 9l6 6"/></svg></div><span class="t">Scan Wine</span><div style="width:38px"></div></div>
      <div id="frame"><i></i><i></i><i></i><i></i><div id="scanline"></div><div class="pill"><span id="pill">Frame the wine label</span></div></div>
      <div class="bottom">
        <div class="toggle"><div class="on">Bottle</div><div>Wine List</div></div>
        <div class="row"><div class="side"></div><div id="shutter"><b></b></div><div class="side"></div></div>
      </div>
      <div id="flash"></div>
    </div>
    <div id="read"><div class="thumb"><!--LABEL--></div><div class="sp" id="sp"></div><div><b>Analysing label…</b><span>Identifying wine with AI</span></div></div>
    <div id="fade"></div>
    <span class="island"></span>
  </div></div></div></div>
  <div id="end"><img src="/logo.png" alt="Vinterest"/><h1>Find wines you'll <strong>love</strong>.<br>Learn while you <strong>sip</strong>.</h1><span class="btn">Join the beta</span><p>vinterest.app</p></div>
</div>
<script src="/demo.js"></script>
<script>
(function () {
  /* The label: Alain Graillot, Crozes-Hermitage 2021, the bottle the sample drinker scans in the app's demos. */
  var LABEL = '<svg viewBox="0 0 560 840" xmlns="http://www.w3.org/2000/svg">'
    + '<defs>'
    + '<radialGradient id="bk" cx="50%" cy="35%" r="80%"><stop offset="0" stop-color="#3a2a22"/><stop offset=".6" stop-color="#1b120f"/><stop offset="1" stop-color="#0a0605"/></radialGradient>'
    + '<linearGradient id="gl" x1="0" x2="1"><stop offset="0" stop-color="#0c1a12"/><stop offset=".28" stop-color="#1f3a2a"/><stop offset=".42" stop-color="#2c5139"/><stop offset=".55" stop-color="#16291e"/><stop offset="1" stop-color="#07100b"/></linearGradient>'
    + '<linearGradient id="pp" x1="0" x2="1"><stop offset="0" stop-color="#d9cdb2"/><stop offset=".3" stop-color="#f1e8d3"/><stop offset=".6" stop-color="#eee3cb"/><stop offset="1" stop-color="#cdbf9f"/></linearGradient>'
    + '<filter id="gr" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4"/><feColorMatrix values="0 0 0 0 .3  0 0 0 0 .24  0 0 0 0 .16  0 0 0 .22 0"/></filter>'
    + '<filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>'
    + '</defs>'
    + '<rect width="560" height="840" fill="url(#bk)"/>'
    // bokeh: a restaurant behind the bottle
    + '<g filter="url(#blur)" opacity=".85"><circle cx="70" cy="90" r="46" fill="#c97a2a"/><circle cx="470" cy="150" r="58" fill="#8a3a1c"/><circle cx="500" cy="660" r="52" fill="#d89a3e"/><circle cx="40" cy="600" r="40" fill="#7a2a1a"/><circle cx="360" cy="40" r="34" fill="#e0b060"/></g>'
    // bottle shoulder and neck
    + '<path d="M150 840 L150 520 C150 430 230 400 230 300 L230 0 L330 0 L330 300 C330 400 410 430 410 520 L410 840 Z" fill="url(#gl)"/>'
    + '<path d="M180 840 L180 540 C180 470 246 440 252 330 L252 0 L262 0 L262 330 C256 450 192 480 190 560 L190 840 Z" fill="rgba(255,255,255,.10)"/>'
    // foil capsule at the top of the neck
    + '<rect x="228" y="0" width="104" height="130" fill="#6b1423"/><rect x="228" y="124" width="104" height="8" fill="#4a0d18"/>'
    // the label
    + '<g><rect x="168" y="372" width="224" height="388" rx="3" fill="url(#pp)"/><rect x="168" y="372" width="224" height="388" rx="3" filter="url(#gr)"/>'
    + '<rect x="178" y="382" width="204" height="368" fill="none" stroke="#7a1f2c" stroke-width="1.4"/><rect x="183" y="387" width="194" height="358" fill="none" stroke="#7a1f2c" stroke-width=".6"/>'
    + '<text x="280" y="425" text-anchor="middle" font-family="Instrument Serif, serif" font-size="13" letter-spacing="3" fill="#7a1f2c">DOMAINE</text>'
    + '<text x="280" y="468" text-anchor="middle" font-family="Instrument Serif, serif" font-size="38" fill="#2a1a14">Alain</text>'
    + '<text x="280" y="508" text-anchor="middle" font-family="Instrument Serif, serif" font-size="38" fill="#2a1a14">Graillot</text>'
    + '<path d="M232 524 H328" stroke="#7a1f2c" stroke-width="1"/><circle cx="280" cy="524" r="3.4" fill="#7a1f2c"/>'
    + '<text x="280" y="560" text-anchor="middle" font-family="Poppins, sans-serif" font-size="14" font-weight="600" letter-spacing="1.8" fill="#2a1a14">CROZES-HERMITAGE</text>'
    + '<text x="280" y="580" text-anchor="middle" font-family="Poppins, sans-serif" font-size="9" letter-spacing="1.6" fill="#5a463a">APPELLATION CONTRÔLÉE</text>'
    + '<text x="280" y="650" text-anchor="middle" font-family="Instrument Serif, serif" font-size="64" fill="#7a1f2c">2021</text>'
    + '<text x="280" y="690" text-anchor="middle" font-family="Poppins, sans-serif" font-size="9" letter-spacing="1.2" fill="#5a463a">MIS EN BOUTEILLE AU DOMAINE</text>'
    + '<text x="280" y="708" text-anchor="middle" font-family="Poppins, sans-serif" font-size="9" letter-spacing="1.2" fill="#5a463a">PRODUCE OF FRANCE</text>'
    + '<text x="196" y="738" font-family="Poppins, sans-serif" font-size="9" fill="#5a463a">750 ml</text><text x="364" y="738" text-anchor="end" font-family="Poppins, sans-serif" font-size="9" fill="#5a463a">13% vol.</text></g>'
    + '</svg>';
  document.querySelectorAll('#cam #feed, #read .thumb').forEach(function (el) { el.insertAdjacentHTML('afterbegin', LABEL); });
  // the commented placeholders are only markers; nothing else to do with them

  var $ = function (id) { return document.getElementById(id); };
  var phoneEl = $('phone'), app = $('app'), cam = $('cam'), feedSvg = $('feed').firstChild, read = $('read'), fade = $('fade');
  var ease = function (t) { t = Math.max(0, Math.min(1, t)); return t * t * (3 - 2 * t); };
  var seg = function (T, a, b) { return Math.max(0, Math.min(1, (T - a) / (b - a))); };
  var lerp = function (a, b, t) { return a + (b - a) * t; };
  // scale 0.9 of a 410 x 864 phone is 369 x 778; centred, a little below the caption
  var S = 0.92;
  phoneEl.style.transform = 'translate(' + (270 - 205 * S) + 'px,' + 118 + 'px) scale(' + S + ')';

  var CAPS = [
    [0.5, 3.2, 'Point it at <b>any wine label</b>.'],
    [3.2, 7.0, 'Scan it. Vinterest <b>reads the label</b>.'],
    [7.4, 12.0, 'A match score, built from <b>your own taste</b>.'],
    [12.0, 20.0, 'With the <b>reasons for and against</b>.'],
    [20.4, 27.0, 'Rate it. The fastest way to <b>sharpen your next match</b>.'],
    [27.0, 31.0, 'Add what you <b>paid</b> and where you had it.'],
    [31.4, 36.6, 'Your <b>WineDNA</b> grows with every bottle.'],
    [36.6, 41.0, 'What you love, <b>in plain words</b>.'],
  ];
  var END = 45, api = null, kind = null, lastP = -1, mountedAt = -1;
  function show(k) {
    if (kind === k) return;
    if (api) api.unmount();
    app.innerHTML = '';
    api = window.VinterestDemo.mount(app, k);
    kind = k; lastP = -1;
  }
  function setP(p) { if (api && Math.abs(p - lastP) > 1e-4) { lastP = p; api.update(p); } }

  // what the app shows, and how far through that demo it is, at each moment
  function appAt(T) {
    if (T < 6.9) return null;
    if (T < 20) return ['scan', T < 12 ? lerp(0, 0.28, ease(seg(T, 7.4, 11.8))) : lerp(0.3, 0.97, seg(T, 12.4, 19.6))];
    if (T < 31) return ['rate', T < 25.8 ? lerp(0, 0.45, ease(seg(T, 20.8, 25.4))) : T < 27 ? 0.5 : lerp(0.74, 0.96, seg(T, 27.2, 30.6))];
    return ['dna', T < 33.5 ? 0 : T < 36.6 ? 0.167 : 0.333];
  }

  function render(T) {
    // The camera: a slow push in on the label and a hand's wobble.
    var push = lerp(0.9, 1.12, ease(seg(T, 0, 5.2)));
    var wx = Math.sin(T * 1.7) * 5 + Math.sin(T * 4.1) * 1.6, wy = Math.cos(T * 1.3) * 5 + Math.cos(T * 3.7) * 1.4, wr = Math.sin(T * 1.1) * 0.9;
    var steady = ease(seg(T, 3.2, 4.4)); // the hand settles as it lines up
    feedSvg.style.transform = 'translate(0px,-150px) translate(' + (wx * (1 - 0.7 * steady)) + 'px,' + (wy * (1 - 0.7 * steady)) + 'px) rotate(' + (wr * (1 - 0.7 * steady)) + 'deg) scale(' + push + ')';
    $('pill').textContent = T < 3.2 ? 'Frame the wine label' : 'Hold steady…';
    // the corner brackets close in a touch as it locks on
    var inset = lerp(0, 8, steady);
    document.getElementById('frame').style.transform = 'scale(' + (1 - inset / 340) + ')';
    // a sweep down the label as it reads
    var sw = seg(T, 3.4, 5.0);
    $('scanline').style.opacity = sw > 0 && sw < 1 ? 1 : 0;
    $('scanline').style.top = (sw * 100) + '%';
    // the shutter, the flash
    var press = ease(seg(T, 5.2, 5.35)) * (1 - ease(seg(T, 5.45, 5.65)));
    $('shutter').style.transform = 'scale(' + (1 - 0.1 * press) + ')';
    $('flash').style.opacity = (T > 5.3 && T < 5.9) ? 0.9 * (1 - seg(T, 5.3, 5.9)) : 0;
    // "Analysing label…" until the match is ready
    var readIn = ease(seg(T, 5.4, 5.8)), readOut = ease(seg(T, 6.9, 7.4));
    read.style.opacity = readIn * (1 - readOut);
    $('sp').style.transform = 'rotate(' + (T * 360 / 0.85) + 'deg)';
    cam.style.opacity = T < 5.8 ? 1 : 0;
    cam.style.visibility = T < 5.9 ? 'visible' : 'hidden';
    read.style.visibility = (T >= 5.4 && T < 7.5) ? 'visible' : 'hidden';
    app.parentNode.querySelector('.statusbar').style.opacity = T < 7.2 ? 0 : 1;
    // the app's own screens
    var a = appAt(T);
    if (a && api !== null || (a && window.VinterestDemo)) { show(a[0]); setP(a[1]); }
    // a soft white between the app's demos
    var f = Math.max(1 - Math.abs(T - 20.3) / 0.35, 1 - Math.abs(T - 31.2) / 0.35, 0);
    fade.style.opacity = f > 0 ? 0.0 : 0;
    // captions
    var c = CAPS.filter(function (x) { return T >= x[0] && T < x[1]; })[0];
    var capEl = $('cap');
    if (c) {
      var o = Math.min(ease(seg(T, c[0], c[0] + 0.35)), 1 - ease(seg(T, c[1] - 0.3, c[1])));
      if (capEl.dataset.k !== c[2]) { capEl.dataset.k = c[2]; capEl.innerHTML = c[2]; }
      capEl.style.opacity = o; capEl.style.transform = 'translateY(' + (1 - o) * 6 + 'px)';
    } else capEl.style.opacity = 0;
    // end card
    $('end').style.opacity = ease(seg(T, 41.6, 42.6));
    phoneEl.style.opacity = 1 - ease(seg(T, 41.6, 42.4));
  }

  var T0 = null, STARTED = false, MANUAL = null;
  window.__ready = function () { return !!window.VinterestDemo; };
  window.__start = function () { STARTED = true; T0 = performance.now(); };
  window.__setT = function (t) { MANUAL = t; };
  window.__END = END;
  function frame(now) {
    if (MANUAL != null) render(MANUAL);
    else if (STARTED) render(Math.min(END, (now - T0) / 1000));
    else render(0);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
